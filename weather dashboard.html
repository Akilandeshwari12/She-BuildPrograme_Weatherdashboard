<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #dff3ff, #f5fbff);
            min-height: 100vh;
            padding: 30px 15px;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #075985;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0284c7;
        }

        .search-box button {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #0369a1;
        }

        .message {
            text-align: center;
            margin: 15px 0;
            font-size: 16px;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            color: #0369a1;
        }

        .weather-card {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            margin-bottom: 25px;
        }

        .location {
            text-align: center;
            margin-bottom: 20px;
        }

        .location h2 {
            color: #075985;
            margin-bottom: 5px;
        }

        .location p {
            color: #666;
        }

        .main-weather {
            text-align: center;
            margin-bottom: 25px;
        }

        .weather-icon {
            width: 100px;
            height: 100px;
        }

        .temperature {
            font-size: 55px;
            font-weight: bold;
            color: #075985;
            margin: 5px 0;
        }

        .condition {
            font-size: 20px;
            color: #444;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .detail-box {
            background: #f0f9ff;
            padding: 18px 10px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-box .icon {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .detail-box h3 {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .detail-box p {
            font-size: 17px;
            font-weight: bold;
            color: #075985;
        }

        .recent-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .recent-header h2 {
            color: #075985;
            font-size: 20px;
        }

        .clear-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #dc2626;
        }

        .recent-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .recent-btn {
            border: 1px solid #0284c7;
            background: white;
            color: #0369a1;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        .recent-btn:hover {
            background: #e0f2fe;
        }

        .no-recent {
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }
        }

        @media (max-width: 400px) {
            .weather-details {
                grid-template-columns: 1fr;
            }

            .temperature {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌤️ Weather Dashboard</h1>

    <p class="subtitle">
        Search for any city and check its current weather
    </p>

    <!-- Search -->
    <div class="search-box">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name..."
        >

        <button onclick="searchWeather()">
            Search
        </button>
    </div>

    <!-- Message -->
    <div id="message" class="message"></div>

    <!-- Weather Card -->
    <div id="weatherCard" class="weather-card">

        <div class="location">
            <h2 id="locationName">--</h2>
            <p id="locationDetails">--</p>
        </div>

        <div class="main-weather">

            <img
                id="weatherIcon"
                class="weather-icon"
                src=""
                alt="Weather Icon"
            >

            <div id="temperature" class="temperature">
                --°C
            </div>

            <div id="condition" class="condition">
                --
            </div>

        </div>

        <div class="weather-details">

            <div class="detail-box">
                <div class="icon">🤗</div>
                <h3>Feels Like</h3>
                <p id="feelsLike">--</p>
            </div>

            <div class="detail-box">
                <div class="icon">💧</div>
                <h3>Humidity</h3>
                <p id="humidity">--</p>
            </div>

            <div class="detail-box">
                <div class="icon">💨</div>
                <h3>Wind Speed</h3>
                <p id="windSpeed">--</p>
            </div>

            <div class="detail-box">
                <div class="icon">🌧️</div>
                <h3>Precipitation</h3>
                <p id="rain">--</p>
            </div>

        </div>

    </div>

    <!-- Recent Searches -->
    <div class="recent-section">

        <div class="recent-header">
            <h2>🕘 Recent Searches</h2>

            <button
                class="clear-btn"
                onclick="clearRecentSearches()"
            >
                Clear History
            </button>
        </div>

        <div id="recentSearches" class="recent-list"></div>

    </div>

</div>


<script>

    // ==========================================
    // API KEY
    // ==========================================

    const API_KEY = "YOUR_API_KEY";


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const cityInput = document.getElementById("cityInput");

    const message = document.getElementById("message");

    const weatherCard = document.getElementById("weatherCard");

    const locationName = document.getElementById("locationName");

    const locationDetails =
        document.getElementById("locationDetails");

    const weatherIcon =
        document.getElementById("weatherIcon");

    const temperature =
        document.getElementById("temperature");

    const condition =
        document.getElementById("condition");

    const feelsLike =
        document.getElementById("feelsLike");

    const humidity =
        document.getElementById("humidity");

    const windSpeed =
        document.getElementById("windSpeed");

    const rain =
        document.getElementById("rain");

    const recentSearchesDiv =
        document.getElementById("recentSearches");


    // ==========================================
    // SEARCH WEATHER
    // ==========================================

    function searchWeather() {

        const city = cityInput.value.trim();

        if (city === "") {

            showMessage(
                "Please enter a city name.",
                "error"
            );

            weatherCard.style.display = "none";

            return;
        }

        getWeather(city);
    }


    // ==========================================
    // GET WEATHER
    // ==========================================

    async function getWeather(city) {

        showMessage(
            "Loading weather information...",
            "loading"
        );

        weatherCard.style.display = "none";

        try {

            const url =
                `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${encodeURIComponent(city)}&aqi=no`;

            const response = await fetch(url);

            const data = await response.json();


            // Check API error

            if (!response.ok || data.error) {

                throw new Error(
                    data.error
                        ? data.error.message
                        : "Unable to get weather information."
                );
            }


            // ==================================
            // LOCATION
            // ==================================

            locationName.textContent =
                `${data.location.name}, ${data.location.country}`;

            locationDetails.textContent =
                `${data.location.region} • ${data.location.localtime}`;


            // ==================================
            // WEATHER
            // ==================================

            temperature.textContent =
                `${data.current.temp_c}°C`;

            condition.textContent =
                data.current.condition.text;


            // ==================================
            // WEATHER ICON
            // ==================================

            weatherIcon.src =
                "https:" + data.current.condition.icon;

            weatherIcon.alt =
                data.current.condition.text;


            // ==================================
            // DETAILS
            // ==================================

            feelsLike.textContent =
                `${data.current.feelslike_c}°C`;

            humidity.textContent =
                `${data.current.humidity}%`;

            windSpeed.textContent =
                `${data.current.wind_kph} km/h`;

            rain.textContent =
                `${data.current.precip_mm} mm`;


            // ==================================
            // SHOW CARD
            // ==================================

            weatherCard.style.display = "block";

            message.textContent = "";

            cityInput.value =
                data.location.name;


            // ==================================
            // SAVE SEARCH
            // ==================================

            saveRecentSearch(
                data.location.name
            );

        }

        catch (error) {

            weatherCard.style.display = "none";

            showMessage(
                "❌ " + error.message,
                "error"
            );

        }
    }


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    // ==========================================
    // SAVE RECENT SEARCH
    // ==========================================

    function saveRecentSearch(city) {

        let recent =
            JSON.parse(
                localStorage.getItem("recentCities")
            ) || [];


        // Remove duplicate

        recent = recent.filter(
            item =>
                item.toLowerCase() !==
                city.toLowerCase()
        );


        // Add city to beginning

        recent.unshift(city);


        // Keep only last 5

        recent = recent.slice(0, 5);


        // Save

        localStorage.setItem(
            "recentCities",
            JSON.stringify(recent)
        );


        displayRecentSearches();
    }


    // ==========================================
    // DISPLAY RECENT SEARCHES
    // ==========================================

    function displayRecentSearches() {

        const recent =
            JSON.parse(
                localStorage.getItem("recentCities")
            ) || [];


        recentSearchesDiv.innerHTML = "";


        if (recent.length === 0) {

            recentSearchesDiv.innerHTML =
                `<p class="no-recent">
                    No recent searches
                </p>`;

            return;
        }


        recent.forEach(city => {

            const button =
                document.createElement("button");

            button.className =
                "recent-btn";

            button.textContent =
                city;


            button.onclick = function () {

                cityInput.value = city;

                getWeather(city);

            };


            recentSearchesDiv.appendChild(
                button
            );

        });
    }


    // ==========================================
    // CLEAR RECENT SEARCHES
    // ==========================================

    function clearRecentSearches() {

        localStorage.removeItem(
            "recentCities"
        );

        displayRecentSearches();
    }


    // ==========================================
    // ENTER KEY SEARCH
    // ==========================================

    cityInput.addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                searchWeather();

            }

        }
    );


    // ==========================================
    // LOAD RECENT SEARCHES
    // ==========================================

    displayRecentSearches();

</script>

</body>
</html>
